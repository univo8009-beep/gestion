<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062A49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UNIVO">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<title>UNIVO — Gestion, factures et reçus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#062A49; --ink-soft:#264A66; --muted:#5A7488;
  --blue:#0A73B4; --blue-deep:#075A8D; --orange:#FF741F; --sky:#DCEBF6;
  --paper:#FFFFFF; --wash:#F2F6FA; --line:#CFE0EC; --line-soft:#E3EDF4;
  --good:#0E7A5F; --good-bg:#E2F1EC; --warn-bg:#FDEADF; --grey-bg:#EDF1F4;
  --rail:#062A49; --rail-ink:#BDD7E8; --rail-line:#123F62;
  --r:4px; --mono:"Archivo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9F2F8; --ink-soft:#C3D7E5; --muted:#8FA9BC;
    --paper:#0F2130; --wash:#091622; --line:#1F3C52; --line-soft:#17303F;
    --sky:#12324A; --good-bg:#10332B; --warn-bg:#3A2412; --grey-bg:#152936;
    --rail:#050F18; --rail-line:#14374F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E9F2F8; --ink-soft:#C3D7E5; --muted:#8FA9BC;
  --paper:#0F2130; --wash:#091622; --line:#1F3C52; --line-soft:#17303F;
  --sky:#12324A; --good-bg:#10332B; --warn-bg:#3A2412; --grey-bg:#152936;
  --rail:#050F18; --rail-line:#14374F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--wash); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-variation-settings:'wdth' 100;
  font-size:14.5px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:700; font-variation-settings:'wdth' 112; letter-spacing:-.01em; line-height:1.15}
a{color:var(--blue)}
button,input,select,textarea{font:inherit; color:inherit; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--orange); outline-offset:2px}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh; align-items:stretch}
.rail{
  width:224px; flex:0 0 224px; background:var(--rail); color:var(--rail-ink);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.rail-logo{padding:20px 18px 14px}
.rail-logo img{width:100%; max-width:172px; height:auto; display:block}
.rail-nav{padding:6px 10px; display:flex; flex-direction:column; gap:1px; overflow-y:auto}
.nav-b{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; border-radius:var(--r); padding:9px 10px;
  color:var(--rail-ink); cursor:pointer; font-size:14px;
}
.nav-b:hover{background:rgba(255,255,255,.07); color:#fff}
.nav-b[aria-current="page"]{background:#fff; color:var(--ink); font-weight:600}
.nav-b .ic{width:16px; text-align:center; opacity:.85}
.nav-b[aria-current="page"] .ic{color:var(--blue); opacity:1}
.rail-foot{margin-top:auto; padding:14px 18px 18px; border-top:1px solid var(--rail-line); font-size:12px; color:#8FB4CE}
.rail-foot strong{display:block; color:#fff; font-weight:600; font-size:12.5px; margin-bottom:3px}
.rail-foot div{margin-top:2px}

.main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column}
.top{
  display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;
  padding:20px 26px 14px; border-bottom:1px solid var(--line); background:var(--paper);
  position:sticky; top:0; z-index:5;
}
.top h1{font-size:23px}
.top .sub{color:var(--muted); font-size:12.5px; margin-top:4px}
.top-act{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.work{padding:22px 26px 60px; max-width:1180px}

/* ---------- controls ---------- */
.btn{
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  padding:8px 13px; border-radius:var(--r); cursor:pointer; font-size:13.5px; font-weight:500;
}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn-p{background:var(--blue); border-color:var(--blue); color:#fff}
.btn-p:hover{background:var(--blue-deep); border-color:var(--blue-deep); color:#fff}
.btn-o{background:var(--orange); border-color:var(--orange); color:#fff}
.btn-o:hover{background:#E5620F; border-color:#E5620F; color:#fff}
.btn-q{border-color:transparent; background:transparent; color:var(--muted); padding:6px 8px}
.btn-q:hover{color:var(--blue); background:var(--sky)}
.btn-d:hover{border-color:#C0392B; color:#C0392B}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.sch{position:relative}
.sch input{
  border:1px solid var(--line); background:var(--paper); border-radius:var(--r);
  padding:8px 11px; width:210px; max-width:42vw;
}
label.f{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  width:100%; border:1px solid var(--line); background:var(--paper); border-radius:var(--r);
  padding:8px 10px;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 2px var(--sky)}
textarea{min-height:64px; resize:vertical}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- panels ---------- */
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--r)}
.panel-h{padding:13px 16px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:10px}
.panel-h h3{font-size:15px}
.panel-h .r{margin-left:auto; display:flex; gap:6px; align-items:center}
.panel-b{padding:16px}
.stack{display:flex; flex-direction:column; gap:18px}

/* ---------- kpi ---------- */
.kpis{display:grid; gap:0; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.kpi{padding:16px 18px; border-left:1px solid var(--line-soft)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:12px; color:var(--muted)}
.kpi .v{font-size:26px; font-weight:700; font-variation-settings:'wdth' 112; margin-top:6px; letter-spacing:-.02em}
.kpi .v small{font-size:13px; font-weight:500; color:var(--muted); margin-left:3px}
.kpi .n{font-size:11.5px; color:var(--muted); margin-top:4px}
.kpi.acc{box-shadow:inset 3px 0 0 var(--orange)}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse}
th{
  text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
  padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:11px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--wash)}
.num{text-align:right; white-space:nowrap}
.tw{overflow-x:auto}
.ref{font-weight:600; font-variation-settings:'wdth' 108}
.sub2{font-size:12px; color:var(--muted)}
.rowact{display:flex; gap:4px; justify-content:flex-end}

.tag{display:inline-block; font-size:11.5px; padding:3px 8px; border-radius:20px; background:var(--grey-bg); color:var(--ink-soft); white-space:nowrap}
.tag.ok{background:var(--good-bg); color:var(--good)}
.tag.part{background:var(--warn-bg); color:#B4530B}
.tag.due{background:var(--sky); color:var(--blue-deep)}
.tag.no{background:var(--grey-bg); color:var(--muted); text-decoration:line-through}

.empty{padding:34px 20px; text-align:center; color:var(--muted)}
.empty h4{font-size:15px; color:var(--ink); margin-bottom:6px}
.empty .btn{margin-top:12px}

.bars{display:flex; flex-direction:column; gap:10px}
.bar-l{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px}
.bar-t{height:7px; background:var(--grey-bg); border-radius:20px; overflow:hidden}
.bar-t i{display:block; height:100%; background:var(--blue); border-radius:20px}
.bar:nth-child(2n) .bar-t i{background:var(--orange)}

.notice{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-left:3px solid var(--orange); border-radius:var(--r); background:var(--paper); font-size:13px; margin-bottom:18px}

/* ---------- lines editor ---------- */
.lines{width:100%}
.lines th{padding:6px 8px}
.lines td{padding:6px 8px; border-bottom:1px solid var(--line-soft)}
.lines input,.lines select{padding:7px 8px}
.lines .c-q{width:74px}
.lines .c-p{width:130px}
.totbox{margin-left:auto; width:min(340px,100%)}
.totline{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}
.totline.grand{border-bottom:0; border-top:2px solid var(--ink); margin-top:4px; padding-top:10px; font-size:17px; font-weight:700; font-variation-settings:'wdth' 112}
.totline .l{color:var(--muted)}
.totline.grand .l{color:var(--ink)}

/* ---------- modal ---------- */
.ov{position:fixed; inset:0; background:rgba(6,42,73,.42); display:flex; align-items:center; justify-content:center; padding:18px; z-index:60}
.ov[hidden]{display:none}
.sheet{background:var(--paper); border-radius:6px; width:min(560px,100%); max-height:88vh; overflow:auto; border:1px solid var(--line); animation:pop .12s ease-out}
@keyframes pop{from{transform:translateY(6px); opacity:.6}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{padding:15px 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center}
.sheet-h h3{font-size:16px}
.sheet-h button{margin-left:auto}
.sheet-b{padding:18px}
.sheet-f{padding:14px 18px; border-top:1px solid var(--line-soft); display:flex; gap:8px; justify-content:flex-end}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:20px; font-size:13.5px; z-index:80; box-shadow:0 6px 20px rgba(6,42,73,.25)}
.toast[hidden]{display:none}

/* ---------- document (facture / reçu) ---------- */
.docwrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:0; overflow:hidden}
.doc{
  --dink:#062A49; --dline:#C9DCE9; --dmuted:#5A7488;
  background:#fff; color:var(--dink); padding:0 0 30px; position:relative;
}
.doc *{color:inherit}
.doc-spine{position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--orange)}
.doc-head{display:flex; gap:22px; align-items:flex-start; padding:30px 34px 22px 40px; position:relative; overflow:hidden}
.doc-head::after{
  content:""; position:absolute; right:-40px; top:-60px; width:300px; height:260px;
  background-image:radial-gradient(#0A73B4 1.6px, transparent 1.7px);
  background-size:11px 11px; opacity:.16; transform:rotate(-8deg); pointer-events:none;
}
.doc-id{margin-left:auto; text-align:right; position:relative; z-index:1}
.doc-kind{font-size:19px; font-weight:700; font-variation-settings:'wdth' 118; color:var(--blue)}
.doc-no{font-size:15px; font-weight:600; margin-top:2px}
.doc-meta{font-size:12px; color:var(--dmuted); margin-top:6px; line-height:1.6}
.doc-logo{width:186px; height:auto}
.doc-ag{font-size:11.5px; color:var(--dmuted); line-height:1.6; margin-top:10px; max-width:250px}
.doc-parties{display:flex; gap:0; border-top:1px solid var(--dline); border-bottom:1px solid var(--dline)}
.doc-party{padding:16px 34px 16px 40px; flex:1 1 50%}
.doc-party+.doc-party{border-left:1px solid var(--dline); padding-left:26px}
.doc-party .lbl{font-size:11px; color:var(--dmuted); margin-bottom:6px}
.doc-party .nm{font-size:15.5px; font-weight:700; font-variation-settings:'wdth' 110}
.doc-party .dt{font-size:12.5px; color:var(--dmuted); margin-top:3px; line-height:1.55}
.doc-body{padding:22px 34px 0 40px}
.doc table{width:100%; border-collapse:collapse}
.doc th{color:var(--dmuted); border-bottom:1.5px solid var(--dink); padding:8px 8px; font-size:11px}
.doc td{border-bottom:1px solid var(--dline); padding:10px 8px; font-size:13.5px}
.doc th:first-child,.doc td:first-child{padding-left:0}
.doc th:last-child,.doc td:last-child{padding-right:0}
.doc .li-t{font-weight:600}
.doc .li-d{font-size:12px; color:var(--dmuted); margin-top:2px}
.perf{border-top:2px dashed var(--dline); margin:24px 40px 0 40px}
.doc-tot{display:flex; gap:30px; padding:18px 34px 0 40px; flex-wrap:wrap}
.doc-words{flex:1 1 280px; font-size:12.5px; line-height:1.6}
.doc-words .lbl{font-size:11px; color:var(--dmuted); margin-bottom:4px}
.doc-words em{font-style:normal; font-weight:600}
.doc-sums{width:min(300px,100%); margin-left:auto}
.doc-sums .r{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--dline)}
.doc-sums .r.g{border-bottom:0; border-top:2px solid var(--dink); margin-top:3px; padding-top:9px; font-size:17.5px; font-weight:700; font-variation-settings:'wdth' 112}
.doc-sums .r .l{color:var(--dmuted)}
.doc-sums .r.g .l{color:var(--dink); font-size:13px; align-self:center}
.doc-foot{padding:24px 34px 0 40px; display:flex; gap:30px; flex-wrap:wrap; align-items:flex-end}
.doc-cond{flex:1 1 300px; font-size:11.5px; color:var(--dmuted); line-height:1.65; white-space:pre-wrap}
.doc-sign{width:200px; text-align:center; font-size:11.5px; color:var(--dmuted)}
.doc-sign .line{border-top:1px solid var(--dink); margin-bottom:6px; height:52px}
.doc-stamp{display:inline-block; border:2px solid var(--good); color:var(--good); padding:4px 12px; border-radius:3px; font-weight:700; font-size:13px; transform:rotate(-3deg)}
.doc-pay{margin:18px 40px 0; background:#F2F6FA; border-radius:4px; padding:12px 16px; font-size:12.5px}
.doc-pay .t{font-weight:600; margin-bottom:4px}
.doc-legal{padding:22px 34px 0 40px; font-size:10.5px; color:var(--dmuted); line-height:1.6}

.login{position:fixed; inset:0; z-index:90; background:var(--wash); display:flex; align-items:center; justify-content:center; padding:20px}
.login[hidden]{display:none}
.login-card{background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--orange); border-radius:6px; padding:28px 26px; width:min(380px,100%); display:flex; flex-direction:column; gap:12px; margin:0}
.login-card img{width:190px; max-width:70%; align-self:center; margin-bottom:6px}
.login-card h2{font-size:19px}
.login-err{color:#C0392B; font-size:13px}
.login-err:empty{display:none}
.login-ok{color:var(--good); font-size:13px}
.login-ok:empty{display:none}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line-soft)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{flex-direction:column}
  .rail{position:static; width:auto; flex:0 0 auto; height:auto; flex-direction:row; align-items:center; gap:8px; padding:8px 12px; overflow-x:auto}
  .rail-logo{padding:0 8px 0 4px; flex:0 0 auto}
  .rail-logo img{width:104px; max-width:none}
  .rail-nav{flex-direction:row; padding:0; gap:2px; overflow:visible}
  .nav-b{white-space:nowrap; padding:8px 11px}
  .nav-b .ic{display:none}
  .rail-foot{display:none}
  .top{padding:16px 16px 12px; position:static}
  .work{padding:16px 16px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .doc-parties{flex-direction:column}
  .doc-party+.doc-party{border-left:0; border-top:1px solid var(--dline); padding-left:40px}
  .doc-head{flex-direction:column; padding:22px 20px 18px 26px}
  .doc-id{margin-left:0; text-align:left}
  .doc-body,.doc-tot,.doc-foot,.doc-legal{padding-left:26px; padding-right:20px}
  .doc-party{padding:14px 20px 14px 26px}
  .perf,.doc-pay{margin-left:26px; margin-right:20px}
}
@media print{
  @page{margin:12mm}
  .rail,.top,.noprint{display:none !important}
  body,.app,.main,.work{background:#fff; padding:0; margin:0; display:block; max-width:none}
  .docwrap{border:0; border-radius:0}
  .doc{padding-bottom:0}
  .doc-head::after{opacity:.1}
  tbody tr:hover{background:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-logo"><img id="railLogo" alt="UNIVO Voyages &amp; Services"></div>
    <nav class="rail-nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="work" id="work"></main>
  </div>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

/* montant en lettres */
const U = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
const T = ["", "", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante", "quatre-vingt", "quatre-vingt"];
function w99(n) {
  if (n < 20) return U[n];
  const d = Math.floor(n / 10), u = n % 10;
  let s = T[d];
  if (d === 7 || d === 9) s += (u === 0 ? "-dix" : "-" + U[10 + u]);
  else if (u === 1 && d !== 8) s += " et un";
  else if (u) s += "-" + U[u];
  else if (d === 8) s += "s";
  return s;
}
function w999(n) {
  if (n < 100) return w99(n);
  const c = Math.floor(n / 100), r = n % 100;
  return (c > 1 ? U[c] + " cent" : "cent") + (c > 1 && !r ? "s" : "") + (r ? " " + w99(r) : "");
}
function wordsFr(n) {
  n = Math.floor(Math.abs(num(n)));
  if (n === 0) return "zéro";
  const sc = [[1e9, "milliard"], [1e6, "million"], [1e3, "mille"]];
  let out = [], rest = n;
  for (const [v, nm] of sc) {
    const q = Math.floor(rest / v);
    if (q) {
      if (nm === "mille") out.push(q > 1 ? w999(q).replace(/cents$/, "cent") + " mille" : "mille");
      else out.push(w999(q) + " " + nm + (q > 1 ? "s" : ""));
      rest -= q * v;
    }
  }
  if (rest) out.push(w999(rest));
  return out.join(" ");
}
function lettres(v, dev) {
  const k = DEV[dev || ag().devise] || DEV.GNF;
  const ent = Math.floor(num(v));
  const cts = Math.round((num(v) - ent) * 100);
  const w = wordsFr(ent);
  const liaison = /(million|milliard)s?$/.test(w) ? " de " : " ";
  let s = w + liaison + (ent > 1 ? k.us : k.u);
  if (k.d && cts) s += " et " + wordsFr(cts) + " " + k.c + (cts > 1 ? "s" : "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- calculs ---------- */
function totaux(f) {
  const ls = f.lignes || [];
  const st = ls.reduce((a, l) => a + num(l.qte) * num(l.pu), 0);
  const cout = ls.reduce((a, l) => a + num(l.qte) * num(l.ps), 0);
  const rem = Math.min(num(f.remise), st);
  const base = st - rem;
  const tva = base * num(f.tva) / 100;
  const marge = base - cout;
  return { st: st, rem: rem, base: base, tva: tva, total: base + tva, cout: cout, marge: marge, taux: base > 0 ? marge / base * 100 : 0 };
}
const pct = (v) => (Math.round(v * 10) / 10).toString().replace(".", ",") + " %";
const mgCls = (v) => (v < -0.004 ? ' style="color:#C0392B"' : "");

const trajet = (v) => (v.origine && v.destination ? v.origine + " → " + v.destination : v.destination || v.origine || "");
const recusDe = (fid) => D.recus.filter((r) => r.factureId === fid);
const paye = (f) => recusDe(f.id).reduce((a, r) => a + num(r.montant), 0);
const solde = (f) => Math.max(0, totaux(f).total - paye(f));
function etat(f) {
  if (f.statut === "annulee") return { k: "annulee", t: "Annulée", c: "no" };
  const tot = totaux(f).total, p = paye(f);
  if (tot > 0 && p >= tot - 0.009) return { k: "payee", t: "Payée", c: "ok" };
  if (p > 0) return { k: "partielle", t: "Acompte versé", c: "part" };
  if (f.statut === "brouillon") return { k: "brouillon", t: "Brouillon", c: "" };
  return { k: "attente", t: "En attente", c: "due" };
}
const cliOf = (f) => (f.client || {});
const srvTri = () => D.services.slice().sort((a, b) => (a.ordre || 99) - (b.ordre || 99) || String(a.libelle).localeCompare(String(b.libelle)));
function numero(kind) {
  const a = ag(), yr = new Date().getFullYear();
  const pref = kind === "fac" ? (a.prefFac || "FAC") : (a.prefRec || "REC");
  const list = kind === "fac" ? D.factures : D.recus;

  let max = 0;
  list.forEach((x) => { const m = rx.exec(String(x.numero || "")); if (m) max = Math.max(max, parseInt(m[1], 10)); });
  return pref + "-" + yr + "-" + String(max + 1).padStart(4, "0");
}

const delai = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("delai")), ms))]);
/* numérotation sûre à plusieurs postes : compteur Firestore en transaction, repli local hors connexion */
async function numeroSur(kind) {
  const loc = numero(kind);
  if (!S.fb || !S.db || !navigator.onLine) return loc;
  const a = ag(), yr = new Date().getFullYear();
  const pref = kind === "fac" ? (a.prefFac || "FAC") : (a.prefRec || "REC");
  const localMax = parseInt(loc.split("-").pop(), 10) - 1;
  const ref = S.db.doc("compteurs/" + kind + "-" + yr);
  try {
    const n = await delai(S.db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      const cur = snap.exists ? num((snap.data() || {}).n) : 0;
      const nx = Math.max(cur, localMax) + 1;
      tx.set(ref, { n: nx });
      return nx;
    }), 7000);
    return pref + "-" + yr + "-" + String(n).padStart(4, "0");
  } catch (e) { return loc; }
}
async function blobSave(req) {

    + "</div>";
  const derniers = D.factures.map((f) => ({ t: "fac", d: f.date, o: f })).concat(D.recus.map((r) => ({ t: "rec", d: r.date, o: r })))

  const relances = duesArr.slice().sort((x, y) => String(x.echeance || x.date).localeCompare(String(y.echeance || y.date))).slice(0, 6);

function setPath(o, path, v) {
  const p = path.split("."); let cur = o;
  for (let i = 0; i < p.length - 1; i++) { const k = /^\d+$/.test(p[i]) ? +p[i] : p[i]; if (cur[k] == null) cur[k] = /^\d+$/.test(p[i + 1]) ? [] : {}; cur = cur[k]; }

}

const csvq = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
async function save(filename, data) {
  if (!S.dl) { toast("Téléchargement indisponible ici."); return; }
  try { await S.dl.save({ filename: filename, data: data }); toast("Fichier enregistré."); }
  catch (e) {
    const c = e && e.code;
    if (c === "declined") return;
    if (c === "rate_limited") toast("Une demande est déjà ouverte, réessayez.");
    else if (c === "too_large") toast("Fichier trop volumineux.");
    else toast("Téléchargement impossible.");
  }
}
function csvFactures() {
  const head = ["Numero", "Date", "Echeance", "Client", "Telephone", "Ville de depart", "Destination", "Date de depart", "Devise", "Sous-total", "Remise", "TVA", "Total", "Prix systeme", "Marge brute", "Taux de marge %", "Paye", "Solde", "Etat"];
  const rows = D.factures.slice().sort((a, b) => String(a.numero).localeCompare(String(b.numero))).map((f) => {
    const t = totaux(f), v = f.voyage || {};
    return [f.numero, f.date, f.echeance, cliOf(f).nom, cliOf(f).tel, v.origine, v.destination, v.depart, f.devise, t.st, t.rem, t.tva, t.total, t.cout, t.marge, Math.round(t.taux * 10) / 10, paye(f), solde(f), etat(f).t].map(csvq).join(";");
  });
  return "\ufeff" + head.map(csvq).join(";") + "\r\n" + rows.join("\r\n");
}
function csvRecus() {
  const head = ["Numero", "Date", "Client", "Objet", "Facture", "Mode", "Reference", "Devise", "Montant"];
  const rows = D.recus.slice().sort((a, b) => String(a.numero).localeCompare(String(b.numero))).map((r) => [r.numero, r.date, (r.client || {}).nom, r.objet, r.factureNumero, r.mode, r.reference, r.devise, num(r.montant)].map(csvq).join(";"));

}

function copie(txt) {
  const done = () => toast("Texte copié, collez-le dans WhatsApp.");
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done).catch(() => fallback(txt, done)); }
  else fallback(txt, done);
}
function fallback(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) done(); else sheet("Texte à copier", '<textarea style="min-height:190px">' + esc(txt) + "</textarea>", '<button class="btn btn-p" data-act="close">Fermer</button>');
}

function lireLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || "null"); } catch (e) { return null; } }
function hasLocal() { const o = lireLocal(); return !!(o && ((o.factures || []).length || (o.recus || []).length || (o.clients || []).length)); }
function envoyerTout(o) {
  if (!S.db || !S.fb) return;
  const ops = [];
  if (o.settings) ops.push(["settings", "agence", o.settings]);
  ["clients", "services", "factures", "recus"].forEach((c) => (o[c] || []).forEach((x) => {
    if (x && x.id) { const b = JSON.parse(JSON.stringify(x)); delete b.id; ops.push([c, String(x.id), b]); }
  }));
  if (!ops.length) { toast("Aucune donnée à envoyer."); return; }
  for (let i = 0; i < ops.length; i += 400) {
    const bt = S.db.batch();
    ops.slice(i, i + 400).forEach((op) => bt.set(op[0] === "settings" ? S.db.doc("settings/agence") : S.db.collection(op[0]).doc(op[1]), op[2]));
    bt.commit().catch(erreur);
  }
  toast(ops.length + " élément(s) envoyés vers la base en ligne.");
}

        : /too-many-requests/.test(c) ? "Trop d'essais. Patientez quelques minutes."
        : /network-request-failed/.test(c) ? "Pas de connexion internet."
        : /operation-not-allowed/.test(c) ? "La connexion par e-mail n'est pas activée dans Firebase (Authentication > Sign-in method)."
        : "Connexion impossible (" + c + ").");
    });
  });
  document.getElementById("lg_reset").addEventListener("click", () => {
    const mail = document.getElementById("lg_mail").value.trim();
    if (!mail) { err("Saisissez d'abord votre e-mail, puis cliquez à nouveau."); return; }
    firebase.auth().sendPasswordResetEmail(mail)
      .then(() => { document.getElementById("loginErr").textContent = ""; document.getElementById("loginOk").textContent = "Un lien de réinitialisation a été envoyé à " + mail + "."; })
      .catch(() => err("Envoi impossible. Vérifiez l'adresse."));
  });
  setTimeout(() => { const m = document.getElementById("lg_mail"); if (m) m.focus(); }, 30);
}
function hideLogin() { const el = document.getElementById("login"); if (el) { el.hidden = true; el.innerHTML = ""; } }

/* ---------- application installable ---------- */
let INSTALL = null;
function pwaInit() {
  S.standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && !S.standalone) { S.ios = true; S.canInstall = true; }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    Promise.all(["manifest.webmanifest", "icon-192.png", "icon-512.png"].map((f) => fetch(f, { cache: "no-store" }).then((r) => (r.ok ? null : f)).catch(() => f)))
      .then((miss) => { miss = miss.filter(Boolean); if (miss.length) { S.note = "Fichiers absents du site : " + miss.join(", ") + ". Déposez-les à côté de index.html pour que le logo s'affiche sur l'icône de l'application."; render(); } });
  }
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INSTALL = e; S.canInstall = true; render(); });
  window.addEventListener("appinstalled", () => { INSTALL = null; S.canInstall = false; render(); toast("UNIVO est installée sur cet appareil."); });
}
ACT.install = async () => {
  if (INSTALL) {
    INSTALL.prompt();
    try { const r = await INSTALL.userChoice; if (r && r.outcome === "accepted") { S.canInstall = false; INSTALL = null; render(true); } } catch (e) {}
    return;
  }
  if (S.ios) {
    sheet("Installer sur iPhone ou iPad", '<ol style="margin:0;padding-left:20px;line-height:1.9"><li>Ouvrez cette page dans <strong>Safari</strong>.</li><li>Touchez le bouton <strong>Partager</strong> (carré avec une flèche).</li><li>Choisissez <strong>Sur l\'écran d\'accueil</strong>, puis <strong>Ajouter</strong>.</li></ol>', '<button class="btn btn-p" data-act="close">Compris</button>');
    return;
  }
  sheet("Installer l'application", '<div>Dans le menu du navigateur (⋮), choisissez <strong>Installer l\'application</strong> ou <strong>Ajouter à l\'écran d\'accueil</strong>.</div>', '<button class="btn btn-p" data-act="close">Compris</button>');
};

boot();

</script>
